# HOW TO SUBMIT to github.com/awesome-dsh-plugin/awesome-dsh-plugin
#
# 1. Add the topic `dsh-plugin` to this repository.
# 2. Fork awesome-dsh-plugin and add ONE file:
#      data/plugins/TianYa-DAO__dsh-wallpaper-engine--packages-dsh-wallpaper-engine.yml
# 3. Copy the block below into that file.
# 4. In the awesome repo run:
#      npm ci
#      node scripts/generate-readme.mjs
#    and commit the regenerated README.md + README.zh.md.
#
# CI requires the dsh.bundle manifest (declared by packages/dsh-wallpaper-engine),
# repo age >= 1 day, and >= 10 commits.
#
# Optional: attach packages/dsh-wallpaper-engine/dsh-wallpaper-engine-0.1.0.tgz
# to a GitHub Release and add the tarball line below.

url: https://github.com/TianYa-DAO/dsh-wallpaper-engine/tree/main/packages/dsh-wallpaper-engine
name: TianYa-DAO/dsh-wallpaper-engine#plugin
category: ui
description:
  en: Turn your Wallpaper Engine collection into DSH chat backgrounds. Auto-discovers your Steam Workshop and local projects, plays video/image/scene wallpapers live, and can even embed DSH onto your Windows desktop.
  zh: 把 Wallpaper Engine 的壁纸变成 DSH 聊天背景。自动发现 Steam 创意工坊与本地项目，视频/图片/场景壁纸实时播放，还能把整个 DSH 嵌进 Windows 桌面。
# tarball: https://github.com/TianYa-DAO/dsh-wallpaper-engine/releases/latest/download/dsh-wallpaper-engine-0.1.0.tgz
